name: Reproduction checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install CPU runtime and check dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Check clone imports without materializing LFS assets
        run: python scripts/check_reproduction.py
      - name: Check reproduction tool types and failure handling
        run: |
          python -m mypy --strict scripts/check_reproduction.py scripts/test_check_reproduction.py launch_gui.py scripts/test_launch_gui.py
          python -m mypy --check-untyped-defs --follow-imports=skip --ignore-missing-imports verify_tta_improvements.py Paradigm/tta_composition/tests/test_verification.py
          python -m mypy --check-untyped-defs --follow-imports=skip --ignore-missing-imports Paradigm/tta_composition/gui.py Paradigm/tta_composition/tests/test_gui_features.py
          python -m unittest scripts.test_check_reproduction scripts.test_launch_gui -v
      - name: Core composition regressions (Windows)
        if: runner.os == 'Windows'
        run: python -m Paradigm.tta_composition.tests.run_checks
      - name: Install Linux GUI test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth tk8.6
      - name: Core composition regressions (Linux, virtual display for Tk)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m Paradigm.tta_composition.tests.run_checks
